<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Igniting Minds Aerospace website." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/images/brand/imapl-favicon.png" type="image/png" />
    <title>Igniting Minds Aerospace</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('imapl-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
